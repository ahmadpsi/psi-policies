<!doctype html>

<title>Policy Manager · PSI</title>

<style>/* Layout: enterprise console — dark navigation rail on the start side, top bar with global search and alerts, content as data grids and panels */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --panel2:#f8f9fb; --hover:#f1f4f8; --sel:#e8effa;
  --ink:#121a26; --ink2:#4a5566; --ink3:#8590a0; --line:#e2e6ec; --line2:#eef1f5;
  --accent:#1d5fd1; --accent2:#174ea9; --accent-soft:#e7effc;
  --rail:#0e1726; --rail2:#16223a; --rail-ink:#c7d0de; --rail-ink2:#7f8ba0; --rail-acc:#5b9bff;
  --add:#127a3c; --add-bg:#e5f5eb; --rem:#b42318; --rem-bg:#fdeceb; --mod:#a15c00; --mod-bg:#fff3d6;
  --s-draft:#5b6576; --s-draft-bg:#eef0f3; --s-pend:#a15c00; --s-pend-bg:#fff3d6; --s-appr:#1d5fd1; --s-appr-bg:#e7effc; --s-rej:#b42318; --s-rej-bg:#fdeceb; --s-impl:#127a3c; --s-impl-bg:#e5f5eb;
  --m0:#d7dee8; --m-on:#1d5fd1; --m-wide:#d97706;
  --shadow:0 12px 40px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.06);
  --sans:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ar:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --rad:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b111b; --panel:#121a27; --panel2:#0f1622; --hover:#18233434; --sel:#1a2b46;
  --ink:#e7ecf3; --ink2:#a9b4c4; --ink3:#6f7c90; --line:#243044; --line2:#1b2535;
  --accent:#5b9bff; --accent2:#7db0ff; --accent-soft:#16294a;
  --rail:#070c14; --rail2:#111a2a;
  --add:#4ade80; --add-bg:#10301f; --rem:#ff8a80; --rem-bg:#3a1715; --mod:#fbbf24; --mod-bg:#3a2a0b;
  --s-draft:#a9b4c4; --s-draft-bg:#1f2938; --s-pend:#fbbf24; --s-pend-bg:#3a2a0b; --s-appr:#7db0ff; --s-appr-bg:#16294a; --s-rej:#ff8a80; --s-rej-bg:#3a1715; --s-impl:#4ade80; --s-impl-bg:#10301f;
  --m0:#2a3647; --m-on:#5b9bff; --m-wide:#f59e0b; --shadow:0 12px 40px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b111b; --panel:#121a27; --panel2:#0f1622; --hover:#18233434; --sel:#1a2b46;
  --ink:#e7ecf3; --ink2:#a9b4c4; --ink3:#6f7c90; --line:#243044; --line2:#1b2535;
  --accent:#5b9bff; --accent2:#7db0ff; --accent-soft:#16294a;
  --rail:#070c14; --rail2:#111a2a;
  --add:#4ade80; --add-bg:#10301f; --rem:#ff8a80; --rem-bg:#3a1715; --mod:#fbbf24; --mod-bg:#3a2a0b;
  --s-draft:#a9b4c4; --s-draft-bg:#1f2938; --s-pend:#fbbf24; --s-pend-bg:#3a2a0b; --s-appr:#7db0ff; --s-appr-bg:#16294a; --s-rej:#ff8a80; --s-rej-bg:#3a1715; --s-impl:#4ade80; --s-impl-bg:#10301f;
  --m0:#2a3647; --m-on:#5b9bff; --m-wide:#f59e0b; --shadow:0 12px 40px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
html[lang="ar"] body{font-family:var(--ar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 10px calc(16px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));overflow-y:auto}
html[dir="rtl"] .rail{padding:16px max(10px,env(safe-area-inset-right,0px)) 16px 10px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:#fff;font-weight:600;font-size:14.5px;line-height:1.2}
.logo .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(150deg,#3b82f6,#1d4ed8);display:grid;place-items:center;flex-shrink:0}
.logo small{display:block;color:var(--rail-ink2);font-weight:400;font-size:11.5px}
.navsec{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--rail-ink2);padding:14px 12px 6px}
html[lang="ar"] .navsec{letter-spacing:0}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;color:var(--rail-ink);font-size:13.5px;font-weight:500}
.nav a:hover{background:var(--rail2);color:#fff}
.nav a[aria-current="page"]{background:var(--rail2);color:#fff;box-shadow:inset 3px 0 0 var(--rail-acc)}
html[dir="rtl"] .nav a[aria-current="page"]{box-shadow:inset -3px 0 0 var(--rail-acc)}
.nav svg{width:17px;height:17px;flex-shrink:0;opacity:.9}
.nav .cnt{margin-inline-start:auto;background:#2b3a55;color:#fff;font-size:11px;border-radius:9px;padding:0 7px;line-height:18px;font-family:var(--mono)}
.nav .cnt.hot{background:#d97706}
.railfoot{margin-top:auto;padding:12px;border-top:1px solid #1d2a40;font-size:12px;color:var(--rail-ink2)}
.railfoot b{display:block;color:var(--rail-ink);font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px max(24px,env(safe-area-inset-right,0px)) 10px max(24px,env(safe-area-inset-left,0px));min-height:56px}
.top .burger{display:none}
.gsearch{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink3);cursor:text}
.gsearch kbd{margin-inline-start:auto;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink3)}
.topend{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.ib{position:relative;border:1px solid transparent;background:none;border-radius:8px;padding:7px 9px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.ib:hover{background:var(--hover);border-color:var(--line)}
.ib svg{width:18px;height:18px}
.badge-dot{position:absolute;top:2px;inset-inline-end:2px;background:#dc2626;color:#fff;font-size:10px;font-family:var(--mono);border-radius:8px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 3px}
.content{padding:24px max(24px,env(safe-area-inset-right,0px)) 64px max(24px,env(safe-area-inset-left,0px));max-width:1440px;width:100%}
/* page header */
.ph{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.ph .sub{color:var(--ink2);margin-top:3px;max-width:75ch}
.ph .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumbs{font-size:12.5px;color:var(--ink3);margin-bottom:6px}
.crumbs a{color:var(--ink2)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 13px;font-weight:500;font-size:13.5px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent2)}
.btn.ok{background:var(--add);border-color:var(--add);color:#fff}
.btn.no{background:var(--panel);border-color:var(--rem);color:var(--rem)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px;min-width:0}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:500}
.kpi .v{font-size:26px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12px;color:var(--ink3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.warn .v{color:var(--s-pend)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);min-width:0}
.panel>.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>.hd h2{font-size:14px;font-weight:600;margin:0}
.panel>.bd{padding:14px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
/* toolbar */
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.inp{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 10px;font-size:13.5px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative;flex:1 1 220px;min-width:0}
.search input{width:100%;padding-inline-start:30px}
.search svg{position:absolute;top:50%;inset-inline-start:9px;transform:translateY(-50%);width:15px;height:15px;color:var(--ink3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:500;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.fchip b{font-family:var(--mono);font-weight:500;color:var(--ink3);font-size:11.5px}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.fchip[aria-pressed="true"] b{color:var(--panel);opacity:.7}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--accent)}
/* table */
.tw{overflow-x:auto}
table.dg{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
.dg th{position:sticky;top:0;background:var(--panel2);z-index:1;font-size:11.5px;font-weight:600;color:var(--ink2);text-align:start;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
.dg th.sort{cursor:pointer;user-select:none}
.dg th.sort:hover{color:var(--ink)}
.dg td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.dg tbody tr.click{cursor:pointer}
.dg tbody tr.click:hover td{background:var(--hover)}
.dg tr:last-child td{border-bottom:0}
.dg .pn{font-weight:600;color:var(--ink)}
.dg td:first-child{min-width:200px}
.dg td{white-space:nowrap}
.dg td:first-child,.dg td .pc{white-space:normal}
.dg .pc{font-size:12px;color:var(--ink3)}
.empty{padding:28px;text-align:center;color:var(--ink3)}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
/* meter */
.mt{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12.5px;font-weight:500}
.mt i{display:inline-block;width:3px;border-radius:1px;background:var(--m0)}
.mt .bars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.mt i:nth-child(1){height:4px}.mt i:nth-child(2){height:6px}.mt i:nth-child(3){height:8px}.mt i:nth-child(4){height:10px}.mt i:nth-child(5){height:12px}
.mt i.f{background:var(--m-on)}
.mt.w i.f{background:var(--m-wide)}
.mt.nt{color:var(--mod)}.mt.nt i{background:none;box-shadow:inset 0 0 0 1px var(--mod)}
/* status pills */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.draft,.st.cancelled{color:var(--s-draft);background:var(--s-draft-bg)}.st.pending{color:var(--s-pend);background:var(--s-pend-bg)}.st.approved{color:var(--s-appr);background:var(--s-appr-bg)}.st.rejected{color:var(--s-rej);background:var(--s-rej-bg)}.st.implemented{color:var(--s-impl);background:var(--s-impl-bg)}
.tag{display:inline-block;font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.vbadge{font-family:var(--mono);font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:4px}
.dl{display:inline-flex;gap:4px;font-family:var(--mono);font-size:12px;font-weight:600}
.dl .a{color:var(--add)}.dl .r{color:var(--rem)}.dl .m{color:var(--mod)}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:12px}
.pcard{border:1px solid var(--line);border-radius:var(--rad);padding:14px;background:var(--panel);display:grid;gap:10px;cursor:pointer}
.pcard:hover{border-color:var(--accent)}
.pcard .t{font-weight:600}
.mods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px}
.mods .ml{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
/* policy detail tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:500;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink2);margin-top:8px}
.meta b{color:var(--ink);font-weight:500}
/* permission view */
.pv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
.modnav{position:sticky;top:72px;display:grid;gap:2px}
.modnav button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;text-align:start;padding:8px 10px;border-radius:6px;font-weight:500;color:var(--ink2)}
.modnav button[aria-selected="true"]{background:var(--sel);color:var(--accent)}
.modnav .dl{font-size:11px}
@media (max-width:860px){.pv{grid-template-columns:1fr}.modnav{position:static;display:flex;overflow-x:auto}.modnav button{white-space:nowrap}}
.sec{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);padding:14px 16px 6px;background:var(--panel2);border-bottom:1px solid var(--line2)}
html[lang="ar"] .sec{letter-spacing:0}
.rr{display:grid;grid-template-columns:minmax(160px,1fr) minmax(0,1.6fr);gap:12px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line2)}
.rr.cmp{grid-template-columns:minmax(150px,.9fr) minmax(0,1.3fr) minmax(0,1.3fr)}
.rr .k{font-size:13.5px;direction:ltr;text-align:start;min-width:0;overflow-wrap:anywhere}
.rr .k small{display:block;color:var(--ink3);font-size:11.5px}
.rr.rhd{background:var(--panel2);font-size:11.5px;font-weight:600;color:var(--ink2);position:sticky;top:56px;z-index:2}
.rr.add{background:var(--add-bg)}.rr.rem{background:var(--rem-bg)}.rr.mod{background:var(--mod-bg)}
.rr.add .k{box-shadow:inset 3px 0 0 var(--add)}.rr.rem .k{box-shadow:inset 3px 0 0 var(--rem)}.rr.mod .k{box-shadow:inset 3px 0 0 var(--mod)}
.rr .k{padding-inline-start:6px}
.sc{display:flex;flex-wrap:wrap;gap:4px;direction:ltr}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:2px 8px;font-size:12px;font-weight:500;color:var(--ink3);white-space:nowrap}
.pill.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.ad{background:var(--add-bg);border-color:var(--add);color:var(--add)}
.pill.rm{background:var(--rem-bg);border-color:var(--rem);color:var(--rem);text-decoration:line-through}
.pill.ed{cursor:pointer}
.pill.ed:hover{border-color:var(--accent)}
.pill.ghost{border-style:dashed}
.none{font-size:12.5px;color:var(--ink3)}
.sw{position:relative;width:36px;height:20px;border-radius:10px;background:var(--m0);flex-shrink:0;border:0;padding:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:inset-inline-start .15s}
.sw.on{background:var(--accent)}.sw.on::after{inset-inline-start:18px}
.sw[disabled]{cursor:default}
.valtxt{font-family:var(--mono);font-size:12.5px;direction:ltr}
.sel{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 6px;font-size:12.5px}
/* editor */
.edbar{position:sticky;top:56px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;box-shadow:0 2px 8px rgba(16,24,40,.05)}
.cnts{display:flex;gap:6px}
.cn{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:4px 10px;font-weight:600;font-size:12.5px}
.cn.a{background:var(--add-bg);color:var(--add)}.cn.r{background:var(--rem-bg);color:var(--rem)}.cn.m{background:var(--mod-bg);color:var(--mod)}
.cn b{font-family:var(--mono)}
.colhd{display:flex;align-items:center;gap:8px}
.lock{font-size:11px;color:var(--ink3);font-weight:500}
.saved{font-size:12px;color:var(--ink3)}
@media (max-width:860px){.rr,.rr.cmp{grid-template-columns:1fr}.rr.rhd{display:none}.rr .cur::before{content:attr(data-l);display:block;font-size:11px;color:var(--ink3)}.rr .drf::before{content:attr(data-l);display:block;font-size:11px;color:var(--ink3)}}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(9,14,23,.45);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);width:min(760px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:16px}
.modal .mb{padding:16px 20px;overflow-y:auto}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--panel2)}
.summ{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:14px 16px;font-size:13.5px}
.summ dl{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;margin:0 0 12px}
.summ dt{color:var(--ink3)}.summ dd{margin:0;font-weight:500}
.summ h4{margin:12px 0 6px;font-size:13px;display:flex;gap:8px;align-items:center}
.summ ul{margin:0;padding-inline-start:20px;font-family:var(--mono);font-size:12.5px;direction:ltr;text-align:start}
.summ li{margin:2px 0;overflow-wrap:anywhere}
.risk{display:grid;gap:6px;margin-top:8px}
.risk div{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.risk .lv{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:3px;text-transform:uppercase;flex-shrink:0}
.lv.h{background:var(--rem-bg);color:var(--rem)}.lv.m{background:var(--mod-bg);color:var(--mod)}.lv.l{background:var(--add-bg);color:var(--add)}
label.fl{display:block;font-size:12.5px;font-weight:500;color:var(--ink2);margin:12px 0 5px}
textarea.inp,input.inp.w,select.inp.w{width:100%}
/* request detail */
.stepper{display:flex;gap:0;margin:6px 0 18px;overflow-x:auto}
.step{flex:1;min-width:120px;position:relative;padding-top:18px}
.step::before{content:"";position:absolute;top:6px;inset-inline-start:0;inset-inline-end:0;height:2px;background:var(--line)}
.step .d{position:absolute;top:0;inset-inline-start:0;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--line)}
.step.done::before{background:var(--add)}.step.done .d{background:var(--add);border-color:var(--add)}
.step.cur .d{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.step.bad .d{background:var(--rem);border-color:var(--rem)}
.step b{display:block;font-size:12.5px;margin-top:4px}
.step span{font-size:11.5px;color:var(--ink3)}
.tl{display:grid;gap:0}
.ev{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.ev:last-child{border-bottom:0}
.ev .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--panel2);border:1px solid var(--line)}
.ev .w{font-size:13px}
.ev .w b{font-weight:600}
.ev .c{margin-top:4px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel2);border-radius:6px;padding:8px 10px}
.ev time{font-size:11.5px;color:var(--ink3)}
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{text-align:start;font-size:11.5px;color:var(--ink2);padding:7px 10px;background:var(--panel2);border-bottom:1px solid var(--line)}
.dt td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.dt td.k{font-family:var(--mono);font-size:12.5px;direction:ltr;text-align:start;overflow-wrap:anywhere}
.dt tr.a td:first-child{box-shadow:inset 3px 0 0 var(--add)}.dt tr.r td:first-child{box-shadow:inset 3px 0 0 var(--rem)}.dt tr.m td:first-child{box-shadow:inset 3px 0 0 var(--mod)}
.dt .va{color:var(--add);font-weight:600}.dt .vr{color:var(--rem)}.dt .vm{color:var(--mod);font-weight:600}
/* matrix */
.mx{border-collapse:separate;border-spacing:0;font-size:12.5px}
.mx th,.mx td{border-bottom:1px solid var(--line2);border-inline-end:1px solid var(--line2);padding:6px 10px;white-space:nowrap}
.mx thead th{position:sticky;top:0;z-index:3;background:var(--panel2);font-weight:600;font-size:11.5px;color:var(--ink2);vertical-align:bottom}
.mx th.rh,.mx td.rh{position:sticky;inset-inline-start:0;z-index:2;background:var(--panel);text-align:start;max-width:360px;overflow:hidden;text-overflow:ellipsis;direction:ltr}
.mx thead th.rh{z-index:4;background:var(--panel2)}
.mx td.c{text-align:center;max-width:170px;white-space:normal;overflow-wrap:anywhere}
.mx td.c .valtxt{font-size:11.5px}
.mx tr.diff td.rh{box-shadow:inset 3px 0 0 var(--mod)}
.mx td.dc{background:var(--mod-bg)}
.mx tr.grp td{background:var(--panel2);font-weight:600;font-size:11.5px;color:var(--ink2);position:sticky;inset-inline-start:0}
.mx .y{color:var(--accent);font-weight:700}.mx .n{color:var(--ink3)}
.mx th.pol{max-width:160px;white-space:normal;line-height:1.25;min-width:110px}
.mx th.pol button{border:0;background:none;color:var(--ink3);padding:0;margin-inline-start:4px}
.heat0{background:transparent}.heat5{background:color-mix(in srgb,var(--m-wide) 14%,transparent)}
.mxwrap{overflow:auto;max-height:calc(100vh - 220px)}
.picker{position:relative}
.dd{position:absolute;top:calc(100% + 4px);inset-inline-start:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);width:340px;max-height:360px;overflow-y:auto;padding:6px}
.dd label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:5px;font-size:13px;cursor:pointer}
.dd label:hover{background:var(--hover)}
/* notifications & palette */
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(400px,100%);background:var(--panel);z-index:70;box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.drawer .hd h3{margin:0;font-size:15px}
.drawer .bd{overflow-y:auto;flex:1}
.nt{display:block;padding:12px 16px;border-bottom:1px solid var(--line2);color:var(--ink);cursor:pointer}
.nt:hover{background:var(--hover)}
.nt.unread{background:var(--accent-soft)}
.nt b{font-weight:600;font-size:13.5px}
.nt p{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.nt time{font-size:11.5px;color:var(--ink3)}
.pal{width:min(640px,100%);align-self:start;margin-top:10vh}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;outline:none;background:transparent}
.pal .res{max-height:50vh;overflow-y:auto;padding:6px}
.pal .grp{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px 4px}
.pal .it{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13.5px}
.pal .it[aria-selected="true"],.pal .it:hover{background:var(--sel)}
.pal .it small{margin-inline-start:auto;color:var(--ink3);font-size:12px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:90;box-shadow:var(--shadow);max-width:90vw}
html[dir="rtl"] .toast{transform:translateX(50%)}
.toast.err{background:var(--rem);color:#fff}
.banner{border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--mod-bg);color:var(--mod)}.banner.info{background:var(--accent-soft);color:var(--accent)}.banner.bad{background:var(--rem-bg);color:var(--rem)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.login .box{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px}
.login h1{font-size:20px;margin:16px 0 4px}
.login p{color:var(--ink2);margin:0 0 18px}
.login .btn{width:100%;justify-content:center;padding:10px}
.list{display:grid}
.li{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line2);font-size:13.5px}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.sevd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sev-High{background:var(--rem)}.sev-Medium{background:var(--mod)}.sev-Low{background:var(--accent)}
/* mobile */
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;inset-block:0;inset-inline-start:0;width:260px;z-index:80;transform:translateX(-100%);transition:transform .2s}
  html[dir="rtl"] .rail{transform:translateX(100%)}
  .rail.open{transform:none!important}
  .top .burger{display:inline-flex}
  .content{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .top{padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px))}
  .gsearch span.txt{display:none}.gsearch kbd{display:none}
  .hide-m{display:none!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}

/* ===== Visual refresh: "Reach" — calm surfaces, one royal-blue accent, access scope shown as concentric reach rings from green (private) to rose (everyone) ===== */
:root{
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#f8fafc; --hover:#f3f6fb; --sel:#eef3ff;
  --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --line:#e6eaf0; --line2:#eff2f6;
  --accent:#2b59c3; --accent2:#2149a6; --accent-soft:#ebf0fd;
  --rail:#0b1324; --rail2:#16213a; --rail-ink:#cbd5e1; --rail-ink2:#7c8aa5; --rail-acc:#7aa2ff;
  --r0:#059669; --r1:#0d9488; --r2:#0891b2; --r3:#2563eb; --r4:#d97706; --r5:#e11d48; --rn:#94a3b8;
  --sh1:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.04);
  --sh2:0 1px 2px rgba(15,23,42,.05),0 8px 24px -6px rgba(15,23,42,.08);
  --sans:"Plus Jakarta Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ar:"IBM Plex Sans Arabic","Plus Jakarta Sans",system-ui,Tahoma,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --rad:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f1a; --panel:#111827; --panel2:#0e1522; --hover:#162033; --sel:#18264a; --ink:#e8edf5; --ink2:#a3b0c4; --ink3:#66748b; --line:#1f2a3c; --line2:#182233;
  --accent:#7aa2ff; --accent2:#9bb9ff; --accent-soft:#17244a; --rail:#060a12; --rail2:#121c31;
  --r0:#34d399; --r1:#2dd4bf; --r2:#22d3ee; --r3:#60a5fa; --r4:#fbbf24; --r5:#fb7185; --rn:#64748b;
  --sh1:0 1px 2px rgba(0,0,0,.3); --sh2:0 1px 2px rgba(0,0,0,.3),0 8px 24px -6px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{
  --bg:#0a0f1a; --panel:#111827; --panel2:#0e1522; --hover:#162033; --sel:#18264a; --ink:#e8edf5; --ink2:#a3b0c4; --ink3:#66748b; --line:#1f2a3c; --line2:#182233;
  --accent:#7aa2ff; --accent2:#9bb9ff; --accent-soft:#17244a; --rail:#060a12; --rail2:#121c31;
  --r0:#34d399; --r1:#2dd4bf; --r2:#22d3ee; --r3:#60a5fa; --r4:#fbbf24; --r5:#fb7185; --rn:#64748b;
  --sh1:0 1px 2px rgba(0,0,0,.3); --sh2:0 1px 2px rgba(0,0,0,.3),0 8px 24px -6px rgba(0,0,0,.45)}
body{font-size:14px;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
html[lang="ar"] body{letter-spacing:0}
/* reach chip */
.reach{--c:var(--rn);display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 4px;border-radius:999px;background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--c);font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.3}
html[dir="rtl"] .reach{padding:3px 4px 3px 10px}
.reach span{color:color-mix(in srgb,var(--c) 78%,var(--ink))}
.reach .rg{width:20px;height:20px;flex-shrink:0;display:block}
.reach.only{padding:2px;background:none}
.reach.r0{--c:var(--r0)}.reach.r1{--c:var(--r1)}.reach.r2{--c:var(--r2)}.reach.r3{--c:var(--r3)}.reach.r4{--c:var(--r4)}.reach.r5{--c:var(--r5)}.reach.rn{--c:var(--rn)}
.reach.rn span{font-weight:500}
/* rail */
.rail{background:linear-gradient(180deg,#0b1324 0%,#0f1a31 100%);border-inline-end:1px solid rgba(255,255,255,.04)}
.logo{padding:6px 10px 22px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#4f7dff,#2b59c3);box-shadow:0 6px 16px -4px rgba(79,125,255,.6)}
.logo .mark svg{width:19px;height:19px}
.navsec{font-size:10.5px;letter-spacing:.1em;padding:16px 12px 8px;font-weight:600}
.nav a{padding:9px 12px;border-radius:10px;font-weight:500;margin:1px 0;transition:background .15s,color .15s}
.nav a svg{opacity:.7}
.nav a[aria-current="page"]{background:rgba(122,162,255,.13);color:#fff;box-shadow:none}
.nav a[aria-current="page"] svg{opacity:1;color:var(--rail-acc)}
html[dir="rtl"] .nav a[aria-current="page"]{box-shadow:none}
.nav .cnt{background:rgba(255,255,255,.1);border-radius:999px;padding:0 8px}
.nav .cnt.hot{background:#f59e0b;color:#1b1203}
.railfoot{border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:2px;padding:14px 12px 4px}
/* top bar */
.top{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid transparent;min-height:64px}
.gsearch{border-radius:999px;background:var(--panel);box-shadow:var(--sh1);border-color:var(--line);padding:9px 14px}
.gsearch kbd{border-radius:6px;background:var(--panel2)}
.ib{border-radius:10px}
/* page */
.content{padding-top:28px}
.ph h1{font-size:26px;font-weight:700;letter-spacing:-.025em}
html[lang="ar"] .ph h1{letter-spacing:0}
.ph .sub{font-size:14.5px}
.crumbs a:hover{color:var(--accent)}
/* buttons + inputs */
.btn{border-radius:10px;padding:8px 14px;font-weight:600;box-shadow:var(--sh1);transition:transform .08s,background .15s,border-color .15s}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#3a68d6,#2b59c3);border-color:#2850b5;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 4px 12px -4px rgba(43,89,195,.55)}
.btn.pri:hover{background:linear-gradient(180deg,#3360cb,#244db0)}
.btn.ok{background:linear-gradient(180deg,#16a34a,#15803d);border-color:#15803d;box-shadow:0 4px 12px -4px rgba(22,163,74,.5)}
.btn.ghost,.btn.sm{box-shadow:none}
.inp{border-radius:10px;padding:8px 12px;background:var(--panel)}
.search input{padding-inline-start:34px}
.fchip{padding:5px 12px;border-radius:999px;font-weight:600;background:var(--panel);transition:all .15s}
.fchip:hover{border-color:var(--ink3)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c)}
.seg{border-radius:10px;padding:3px;background:var(--panel2);gap:2px}
.seg button{border-radius:7px;padding:5px 12px;font-weight:600}
.seg button+button{border:0}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--sh1)}
/* panels */
.panel{border-radius:var(--rad);box-shadow:var(--sh2);border-color:var(--line)}
.panel>.hd{padding:14px 18px}
.panel>.hd h2{font-size:14.5px;font-weight:700}
.tbar{padding:12px 16px;gap:10px}
/* KPIs */
.kpis{gap:14px;margin-bottom:22px}
.kpi{display:flex;gap:14px;align-items:flex-start;border-radius:var(--rad);box-shadow:var(--sh2);padding:18px}
.kpi .ki{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.kpi .ki svg{width:20px;height:20px}
.k-total{background:#eef2ff;color:#4338ca}.k-active{background:#ecfdf5;color:#047857}.k-recent{background:#eff6ff;color:#1d4ed8}.k-pending{background:#fff7ed;color:#c2410c}.k-last{background:#f1f5f9;color:#334155}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ki{background:var(--panel2)!important;color:var(--accent)!important}}
:root[data-theme="dark"] .ki{background:var(--panel2)!important;color:var(--accent)!important}
.kpi .kt{min-width:0}
.kpi .l{font-size:12.5px;font-weight:600;color:var(--ink2)}
.kpi .v{font-family:var(--sans);font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.kpi.date .v{font-size:18px;margin-top:6px}
.kpi.warn .v{color:#c2410c}
/* table */
.dg th{background:transparent;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:12px 14px;border-bottom:1px solid var(--line)}
html[lang="ar"] .dg th{text-transform:none;letter-spacing:0;font-size:12px}
.dg td{padding:12px 14px;border-bottom:1px solid var(--line2)}
.dg tbody tr.click{transition:background .12s}
.dg .pn{font-weight:700;font-size:13.5px}
.pcell{display:flex;align-items:center;gap:12px;min-width:0}
.pcell.big .av{width:48px;height:48px;font-size:16px;border-radius:14px}
.av{--c:#64748b;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 22%,transparent)}
.vbadge{border-radius:6px;font-weight:600}
.num{font-weight:600}
/* cards */
.cards{gap:14px;padding:16px}
.pcard{border-radius:var(--rad);box-shadow:var(--sh1);transition:box-shadow .15s,border-color .15s,transform .15s;padding:16px}
.pcard:hover{box-shadow:var(--sh2);transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.mods{gap:10px 12px}
.mods .ml{font-weight:700;margin-bottom:3px}
/* module nav, permission rows */
.modnav{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:6px;box-shadow:var(--sh1)}
.modnav button{border-radius:9px;padding:9px 10px;font-weight:600}
.modnav button[aria-selected="true"]{background:var(--sel);color:var(--accent)}
.rr{padding:11px 18px}
.sec{padding:12px 18px 6px;letter-spacing:.08em}
.pill{border-radius:999px;padding:3px 10px;font-weight:600}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.sw{width:38px;height:22px;border-radius:11px}
.sw::after{width:18px;height:18px}
.sw.on::after{inset-inline-start:18px}
.edbar{border-radius:var(--rad);box-shadow:var(--sh2);top:72px}
.cn{border-radius:999px;padding:5px 12px}
.tabs button{font-weight:600;padding:10px 16px}
.st{padding:3px 10px}
/* matrix */
.mx th,.mx td{padding:8px 12px}
.mx thead th{background:var(--panel2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.heat5{background:transparent}
.mx .y{color:var(--r0)}
/* overlays */
.modal{border-radius:18px}
.drawer{border-start-start-radius:18px;border-end-start-radius:18px}
.toast{border-radius:999px;padding:11px 18px;font-weight:600}
/* login */
.login{background:radial-gradient(1200px 600px at 10% -10%,#dbe6ff 0%,transparent 60%),radial-gradient(900px 500px at 110% 110%,#ffe4ec 0%,transparent 55%),var(--bg)}
.login .box{border-radius:20px;box-shadow:var(--sh2);padding:32px}
@media (prefers-reduced-motion:reduce){.pcard:hover{transform:none}}

.legendrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--ink3);font-weight:600}
.legendrow>span:first-child{margin-inline-end:6px;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.legendrow .reach{font-size:12px}
.legendrow .arr{font-style:normal;color:var(--ink3);opacity:.6}
html[dir="rtl"] .legendrow .arr{transform:scaleX(-1);display:inline-block}
.dg td:first-child{min-width:270px}

@media (max-width:640px){.kpi{flex-direction:column;gap:10px;padding:14px}.kpi .v{font-size:24px}.kpi .ki{width:34px;height:34px;border-radius:10px}.ph h1{font-size:22px}}

/* compare page */
.cmppick{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:16px}
.cmpsel{width:100%;padding:10px 12px;font-weight:600}
.swap{border:1px solid var(--line);background:var(--panel2);width:40px;height:40px;justify-content:center;border-radius:999px}
.swap:hover{color:var(--accent);border-color:var(--accent)}
.cmpsugg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 16px 16px;font-size:12.5px}
.cmphead{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin-bottom:16px}
.cmpcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh2);padding:16px 18px;position:relative;overflow:hidden;min-width:0}
.cmpcard::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--ca)}
.cmpcard.a{--ca:#2b59c3}.cmpcard.b{--ca:#e11d48}
.cmpcard .side{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--ca);border-radius:6px;padding:0 7px;margin-bottom:4px}
.cmpcard .pn{display:block;font-weight:700;font-size:15.5px;color:var(--ink)}
.cmpcard .pc{font-size:12.5px;color:var(--ink3);margin-top:2px}
.cmpstats{display:grid;grid-template-columns:repeat(2,minmax(90px,1fr));gap:8px;align-content:center}
.cmpstats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:center;box-shadow:var(--sh1)}
.cmpstats b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.cmpstats span{font-size:11.5px;color:var(--ink3);font-weight:600}
.cmpstats .ok{color:var(--r0)}.cmpstats .ia{color:#2b59c3}.cmpstats .ib2{color:#e11d48}.cmpstats .md{color:var(--mod)}
.cmprows{display:grid}
.cmprow{display:grid;grid-template-columns:110px 1fr 150px 1fr 130px;gap:10px;align-items:center;padding:10px 18px;border:0;border-bottom:1px solid var(--line2);background:none;text-align:start;width:100%;font:inherit;color:inherit}
.cmprow:last-child{border-bottom:0}
button.cmprow:hover{background:var(--hover)}
.cmprow.sel{background:var(--sel)}
.cmprow.hdr{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700;padding-block:10px 6px}
.cmprow .mname{font-weight:700}
.cmprow .dn{font-size:12.5px;color:var(--ink2);text-align:end}
.cmprow .dn b{color:var(--mod)}
.verd{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.verd.eq{background:var(--panel2);color:var(--ink3)}.verd.wa{background:#ebf0fd;color:#2b59c3}.verd.wb{background:#ffe4ea;color:#be123c}
.segn{display:inline-block;background:var(--mod-bg);color:var(--mod);border-radius:999px;font-size:10.5px;padding:0 6px;margin-inline-start:4px}
.cmplegend{display:flex;gap:8px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line2);font-size:12px}
@media (max-width:860px){.cmppick,.cmphead{grid-template-columns:1fr}.swap{justify-self:center;transform:rotate(90deg)}.cmprow{grid-template-columns:1fr 1fr;row-gap:6px}.cmprow .vs,.cmprow .dn{text-align:start}.cmprow.hdr{display:none}.cmpstats{grid-template-columns:repeat(4,1fr)}}

.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink3);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;transition:all .12s}
button.rchip:hover{border-color:var(--accent);color:var(--accent)}
.rchip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.mrow{flex-wrap:wrap;gap:12px}
.addm{display:grid;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:var(--panel2);border-end-start-radius:var(--rad);border-end-end-radius:var(--rad)}
.addm .btn{justify-self:start}

.decbtns{display:flex;gap:8px}.decbtns .btn[disabled]{box-shadow:none;filter:grayscale(.4)}

let CAT=[],KIND={},STRUCT={};
function buildCatalog(cat){CAT=cat;KIND={};cat.forEach(([k,kind])=>KIND[k]=kind);STRUCT={};
  MODULES.forEach(m=>{const items=[],rules=new Map();
    cat.filter(([k])=>k.startsWith(m+'|')).forEach(([k,kind])=>{const path=k.slice(m.length+1),parts=path.split(' › '),last=parts.at(-1);
      if(GRIDCOLS.includes(last)&&parts.length>1){const rule=parts.slice(0,-1).join(' › ');let r=rules.get(rule);if(!r){r={type:'rule',rule,name:parts.at(-2),section:parts.slice(0,-2).join(' › '),cols:{}};rules.set(rule,r);items.push(r);}r.cols[last]=k;}
      else items.push({type:'opt',key:k,name:parts.length>1&&(parts[0]==='Sale'||parts[0]==='Lease')?parts.slice(1).join(' › '):path,section:parts.length>1&&(parts[0]==='Sale'||parts[0]==='Lease')?parts[0]:'',kind});});
    STRUCT[m]=items;});}
function val(perms,k){const v=perms?perms[k]:undefined;if(v!==undefined)return v;const kd=KIND[k];return kd==='na'?'N/A':kd==='toggle'?'Disabled':kd==='unit'?'':kd==='days'?'':'Not set (any)';}
const isOn=v=>typeof v==='string'&&v.startsWith('Enabled');
function diffMaps(a,b){a=a||{};b=b||{};const keys=new Set([...Object.keys(a),...Object.keys(b)]);const r={added:[],removed:[],modified:[]};
  [...keys].sort().forEach(k=>{const va=a[k],vb=b[k];if(va===vb)return;if(va===undefined&&isOn(vb))r.added.push(k);else if(isOn(va)&&vb===undefined)r.removed.push(k);else r.modified.push({key:k,from:va??'—',to:vb??'—'});});return r;}
function keyChange(a,b,k){const va=(a||{})[k],vb=(b||{})[k];if(va===vb)return null;if(va===undefined&&isOn(vb))return 'add';if(isOn(va)&&vb===undefined)return 'rem';return 'mod';}

function widest(p,prefix){let b=null,col=null;for(const c of SCOPECOLS){if(isOn((p||{})[prefix+' › '+c])&&(b===null||LV[c]>b)){b=LV[c];col=c;}}return [b,col];}
function scope(perms,mod){let lv=null,col=null;
  if(mod==='Units'){for(const tag of ['Sale','Lease']){const [w,c]=widest(perms,`Units|${tag} › More rules › Created by`);if(w!==null&&(lv===null||w>lv)){lv=w;col=c;}}}
  else{for(const r of ROWS[mod]){const [w,c]=widest(perms,`${mod}|${r}`);if(w!==null&&(lv===null||w<lv)){lv=w;col=c;}}}
  if(lv===null)return {lvl:-1,key:'notick'};
  const key={'Everyone':'all','My branch':'branch','Business group':'bg','Teams I manage':'tman','Teams I lead':'tled','My team':'team','Named people':'named','Me':'me'}[col];return {lvl:lv,key};}

function analyse(base,draft,pol){const d=diffMaps(base,draft),R=[];
  MODULES.forEach(m=>{const a=scope(base,m),b=scope(draft,m);if(a.lvl!==b.lvl||a.key!==b.key){const wider=b.lvl>a.lvl;R.push({lv:wider?(b.lvl===5?'h':'m'):'l',txt:`${m}: ${t('lvl',a.key)} → ${t('lvl',b.key)}`});}});
  d.removed.filter(k=>/\|.*Hide /.test(k)).forEach(k=>R.push({lv:'h',txt:(LANG==='ar'?'إطفاء حماية بيانات: ':'Turns off data protection: ')+label(k)}));
  d.added.filter(k=>/\|.*Hide /.test(k)).forEach(k=>R.push({lv:'l',txt:(LANG==='ar'?'إضافة حماية بيانات: ':'Adds data protection: ')+label(k)}));
  d.added.filter(k=>/› Everyone$/.test(k)&&!/Hide/.test(k)).forEach(k=>R.push({lv:'h',txt:(LANG==='ar'?'بيفتح للكل: ':'Opens to everyone: ')+label(k).replace(/ › Everyone$/,'')}));
  d.modified.filter(x=>/Unit number shown to$/.test(x.key)&&/Everyone/.test(x.to)).forEach(x=>R.push({lv:'m',txt:(LANG==='ar'?'رقم الوحدة والمالك بيظهروا للكل: ':'Unit number and owner shown to everyone: ')+label(x.key).replace(/ › Unit number shown to$/,'')}));
  d.modified.concat(d.added.map(k=>({key:k})),d.removed.map(k=>({key:k}))).filter(x=>/Narrow by|Active in|Lead status/.test(x.key)).forEach(x=>R.push({lv:'m',txt:(LANG==='ar'?'تغيير فلتر: ':'Changes a filter: ')+label(x.key)}));
  const order={h:0,m:1,l:2};R.sort((x,y)=>order[x.lv]-order[y.lv]);
  const seen=new Set();return {diff:d,risks:R.filter(r=>!seen.has(r.txt)&&seen.add(r.txt)),people:pol?pol.people:0};}

function openNotifs(){closeOverlay();const d=document.createElement('div');d.id='ovl';d.innerHTML=`<div class="scrim" data-act="close" style="background:rgba(9,14,23,.25)"></div><aside class="drawer"><div class="hd"><h3>${t('notifications')}</h3><button class="btn sm ghost" data-act="readall" style="margin-inline-start:auto">${t('markAll')}</button><button class="ib" data-act="close">${ICON.x}</button></div><div class="bd">${ST.notifs.map(n=>`<a class="nt ${n.read_at?'':'unread'}" data-act="notif" data-id="${n.id}" data-cr="${n.cr_id||''}"><b>${esc(n.title)}</b><p>${esc(n.body||'')}</p><time>${fmtDT(n.created_at)}</time></a>`).join('')||`<div class="empty">${t('noNotifs')}</div>`}</div></aside>`;document.body.appendChild(d);}

// ---------- compare two policies ----------
function polSelect(id,cur,other){return `<select class="inp cmpsel" id="${id}"><option value="">${esc(t('cmpPick'))}</option>${[...new Set(ST.policies.map(p=>p.category))].map(c=>`<optgroup label="${esc(c)}">${ST.policies.filter(p=>p.category===c).sort((a,b)=>b.people-a.people||a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}" ${cur===p.id?'selected':''} ${other===p.id?'disabled':''}>${esc(p.name)} · ${p.people}</option>`).join('')}</optgroup>`).join('')}</select>`;}
function cmpCard(p,side){const v=ST.cur[p.id]||{};return `<div class="cmpcard ${side}"><div class="pcell">${avatar(p)}<div style="min-width:0"><div class="side">${side==='a'?'A':'B'}</div><a class="pn" href="#/policy/${p.id}">${esc(p.name)}</a><div class="pc">${esc(p.category)} · ${p.people} ${t('people')} · <span class="vbadge">v${v.version||1}</span></div></div></div></div>`;}
function vCompare(a,b){const A=ST.byId[a],B=ST.byId[b];
  const head=`<div class="ph"><div><h1>${t('compare')}</h1><div class="sub">${t('cmpSub')}</div></div></div>
  <div class="panel" style="margin-bottom:16px"><div class="cmppick">${polSelect('cmpA',a,b)}<button class="ib swap" data-act="cmpswap" aria-label="${esc(t('swap'))}" title="${esc(t('swap'))}" ${A&&B?'':'disabled'}>${ICON.swap}</button>${polSelect('cmpB',b,a)}</div>
   ${!A||!B?`<div class="cmpsugg"><span class="faint">${t('cmpTry')}</span>${[[1,38],[1,20],[39,78],[30,57],[38,12]].filter(([x,y])=>ST.byId[x]&&ST.byId[y]).map(([x,y])=>`<a class="fchip" href="#/compare/${x}/${y}">${esc(ST.byId[x].name)} ↔ ${esc(ST.byId[y].name)}</a>`).join('')}</div>`:''}</div>`;
  if(!A||!B)return head;
  const pa=(ST.cur[a]||{}).perms||{},pb=(ST.cur[b]||{}).perms||{};const d=diffMaps(pa,pb);const total=CAT.filter(([k,kd])=>kd!=='na').length;const same=total-d.added.length-d.removed.length-d.modified.length;
  const rows=MODULES.map(m=>{const sa=scope(pa,m),sb2=scope(pb,m);const dm=diffMaps(pick(pa,m),pick(pb,m));const n=dm.added.length+dm.removed.length+dm.modified.length;
    const verdict=sa.lvl===sb2.lvl?`<span class="verd eq">${t('sameReach')}</span>`:sa.lvl>sb2.lvl?`<span class="verd wa">A ${t('wider')}</span>`:`<span class="verd wb">B ${t('wider')}</span>`;
    return `<button class="cmprow ${UI.cMod===m?'sel':''}" data-act="cmod" data-m="${m}"><span class="mname">${m}</span><span>${meter(sa)}</span><span class="vs">${verdict}</span><span>${meter(sb2)}</span><span class="dn">${n?`<b>${n}</b> ${t('diffs')}`:`<span class="faint">✓ ${t('identical')}</span>`}</span></button>`;}).join('');
  if(!UI.cMod)UI.cMod=MODULES.find(m=>{const dm=diffMaps(pick(pa,m),pick(pb,m));return dm.added.length+dm.removed.length+dm.modified.length;})||'Leads';
  return head+`<div class="cmphead">${cmpCard(A,'a')}<div class="cmpstats"><div><b class="ok">${same}</b><span>${t('identical')}</span></div><div><b class="ia">${d.removed.length}</b><span>${t('onlyA')}</span></div><div><b class="ib2">${d.added.length}</b><span>${t('onlyB')}</span></div><div><b class="md">${d.modified.length}</b><span>${t('diffVals')}</span></div></div>${cmpCard(B,'b')}</div>
  <div class="panel" style="margin-bottom:16px"><div class="hd"><h2>${t('reachByModule')}</h2><span class="faint" style="font-size:12.5px">${t('clickModule')}</span></div><div class="cmprows"><div class="cmprow hdr"><span></span><span>A · ${esc(A.name)}</span><span></span><span>B · ${esc(B.name)}</span><span></span></div>${rows}</div></div>
  <div class="panel"><div class="tbar"><div class="seg">${MODULES.map(m=>{const dm=diffMaps(pick(pa,m),pick(pb,m));const n=dm.added.length+dm.removed.length+dm.modified.length;return `<button data-act="cmod" data-m="${m}" aria-pressed="${UI.cMod===m}">${m}${n?` <span class="segn">${n}</span>`:''}</button>`;}).join('')}</div>
    <div class="search">${ICON.search}<input class="inp" id="cq" placeholder="${esc(t('filterPerms'))}" value="${esc(UI.cQ||'')}"></div><button class="fchip" data-act="cdiff" aria-pressed="${UI.cOnly!==false}">${t('changedOnly')}</button>
    ${can.create()?`<button class="btn sm" data-act="alignA" data-a="${a}" data-b="${b}" title="${esc(t('alignHelp'))}">${t('alignA')}</button>`:''}</div>
   <div class="cmplegend"><span class="pill ad">${t('lgOnlyB')}</span><span class="pill rm">${t('lgOnlyA')}</span><span class="pill" style="background:var(--mod-bg);color:var(--mod);border-color:var(--mod)">${t('lgDiffVal')}</span></div>
   ${permPanel({mod:UI.cMod,left:pa,right:pb,mode:'compare',q:UI.cQ||'',changedOnly:UI.cOnly!==false,hdA:`A · ${esc(A.name)}`,hdB:`B · ${esc(B.name)}`})}</div>`;}

// ===================== events, auth, boot =====================
const busyTyping=()=>{const a=document.activeElement;return a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type!=='checkbox')||a.tagName==='SELECT');};
function rerender(){const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;render();if(id){const el=document.getElementById(id);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos);}catch(e){}}}}
async function act(fn,okMsg){try{const r=await fn();if(okMsg)toast(okMsg);return r??true;}catch(e){console.error(e);toast(errMsg(e),1);return false;}}
function rebaseDraft(c){const cur=ST.cur[c.policy_id],old=UI.verPerms[c.policy_id+':'+c.base_version];const draft=UI.ed&&UI.ed.id===c.id?UI.ed.draft:c.draft;if(!old)return null;
  const d=diffMaps(old,draft),n=JSON.parse(JSON.stringify(cur.perms||{}));d.added.forEach(k=>n[k]=draft[k]);d.removed.forEach(k=>delete n[k]);d.modified.forEach(x=>{if(x.to==='—')delete n[x.key];else n[x.key]=x.to;});return n;}
async function flushDraft(){if(!UI.ed)return;clearTimeout(edSave.t);await q(sb.from('change_requests').update({draft:UI.ed.draft,title:UI.ed.title||null}).eq('id',UI.ed.id).select('id'));}
document.addEventListener('click',async e=>{const T=e.target;const el=T.closest('[data-act]');
  if(!el){const g=T.closest('[data-go]');if(g&&!T.closest('a,button:not([data-go]),input,select,label')){go(g.dataset.go);}
    if($('#rail.open')&&!T.closest('#rail'))$('#rail').classList.remove('open');return;}
  const a=el.dataset.act,id=+el.dataset.id;
  switch(a){
  case 'burger':$('#rail').classList.toggle('open');break;
  case 'palette':openPalette();break;
  case 'notifs':openNotifs();break;
  case 'close':closeOverlay();break;
  case 'lang':LANG=LANG==='en'?'ar':'en';try{localStorage.setItem('lang',LANG)}catch(_){}applyLang();render();break;
  case 'signout':await sb.auth.signOut();location.hash='';location.reload();break;
  case 'tg':UI[el.dataset.k]=!UI[el.dataset.k];render();break;
  case 'view':UI.view=el.dataset.v;saveUI();render();break;
  case 'cat':UI.cat=el.dataset.v;render();break;
  case 'pmod':UI.pMod=el.dataset.m;render();break;
  case 'edmod':UI.edMod=el.dataset.m;edRefresh();break;
  case 'edchanged':UI.edChanged=!UI.edChanged;edRefresh();break;
  case 'mxwith':UI.mxMode='perm';if(!UI.mxSel.includes(id))UI.mxSel=[id,...UI.mxSel].slice(0,12);saveUI();go('#/matrix');break;
  case 'newcr':{const ex=ST.crs.find(c=>c.policy_id===id&&c.status==='draft'&&c.requested_by===ST.me);if(ex){go('#/cr/'+ex.id+'/edit');break;}
    const nid=await act(()=>rpc('cr_create',{p_policy:id}));if(nid){await reload(['crs']);UI.edMod='Leads';go('#/cr/'+nid+'/edit');}break;}
  case 'restore':openConfirm(t('vRestore')+' v'+el.dataset.v,LANG==='ar'?'بينعمل طلب تعديل يرجّع هالنسخة، وبيمر بنفس خطوات الاعتماد.':'This creates a change request that restores this version. It goes through the normal approval steps.',t('vRestore'),'dorestore',{id,v:el.dataset.v});break;
  case 'dorestore':{closeOverlay();const nid=await act(()=>rpc('cr_create',{p_policy:id,p_kind:'rollback',p_from_version:+el.dataset.v}));if(nid){await reload(['crs']);go('#/cr/'+nid+'/edit');}break;}
  case 'tog':{const k=el.dataset.k,c=ST.crs.find(x=>x.id===UI.ed.id),cur=ST.cur[c.policy_id],base=c.base_version===cur.version?cur.perms:UI.verPerms[c.policy_id+':'+c.base_version]||{};
    if(isOn(UI.ed.draft[k]))delete UI.ed.draft[k];else UI.ed.draft[k]=isOn(base[k])?base[k]:'Enabled';edRefresh();edSave();break;}
  case 'summary':{const c=ST.crs.find(x=>x.id===id);const cur=ST.cur[c.policy_id];if(c.base_version!==cur.version&&!UI.verPerms[c.policy_id+':'+c.base_version]){await loadVersionPerms(c.policy_id,[c.base_version]);}openSummary(id);break;}
  case 'submit':{const j=$('#just').value.trim();if(!j){toast(LANG==='ar'?'اكتب السبب':'Add a justification',1);$('#just').focus();break;}
    await act(flushDraft);const ok=await act(()=>rpc('cr_submit',{p_id:id,p_justification:j}),t('done_'));if(ok){closeOverlay();UI.ed=null;await reload(['crs']);delete UI.crEvents[id];go('#/cr/'+id);}break;}
  case 'discard':openConfirm(t('discard'),LANG==='ar'?'الطلب بينلغى، بس بيضل بالسجل.':'The request is cancelled. It stays in the history.',t('discard'),'dodiscard',{id});break;
  case 'dodiscard':{closeOverlay();const ok=await act(()=>rpc('cr_cancel',{p_id:id,p_comment:'Discarded by requester'}));if(ok){UI.ed=null;await reload(['crs']);go('#/requests');}break;}
  case 'withdraw':{const ok=await act(()=>rpc('cr_cancel',{p_id:id,p_comment:'Withdrawn'}),t('done_'));if(ok){await reload(['crs']);delete UI.crEvents[id];render();}break;}
  case 'rebase':{const c=ST.crs.find(x=>x.id===id);await loadVersionPerms(c.policy_id,[c.base_version]);const n=rebaseDraft(c);if(!n)break;
    const ok=await act(async()=>{await q(sb.from('change_requests').update({draft:n}).eq('id',id).select('id'));await rpc('cr_refresh_base',{p_id:id});},t('done_'));if(ok){UI.ed=null;await reload(['crs']);render();}break;}
  case 'decide':{const cm=($('#decC')||{}).value||'';if(el.dataset.v==='rejected'&&!cm.trim()){toast(LANG==='ar'?'اكتب سبب الرفض':'Add a reason for rejecting',1);$('#decC').focus();break;}
    const ok=await act(()=>rpc('cr_decide',{p_id:id,p_decision:el.dataset.v,p_comment:cm}),t('done_'));if(ok){await reload(['crs','notifs']);delete UI.crEvents[id];render();}break;}
  case 'implement':{if(!$('#implOk').checked){toast(LANG==='ar'?'أكّد إنك طبّقت التعديل بالـ CRM':'Confirm you applied the change in the CRM',1);break;}
    const ok=await act(()=>rpc('cr_implement',{p_id:id,p_comment:$('#implC').value}),t('done_'));if(ok){const c=ST.crs.find(x=>x.id===id);delete UI.verList[c.policy_id];await reload(['crs','cur','notifs']);delete UI.crEvents[id];render();}break;}
  case 'comment':{const b=$('#cmt').value.trim();if(!b)break;const ok=await act(()=>rpc('cr_comment',{p_id:id,p_body:b}));if(ok){delete UI.crEvents[id];render();}break;}
  case 'review':{const v=el.dataset.v;const ok=await act(()=>v==='none'?q(sb.from('reviews').delete().eq('policy_id',id)):q(sb.from('reviews').upsert({policy_id:id,status:v,by_email:ST.me,at:new Date().toISOString()})),t('saved'));if(ok){await reload(['misc']);render();}break;}
  case 'addnote':{const tx=$('#noteTxt').value.trim();if(!tx)break;const ok=await act(()=>q(sb.from('notes').insert({policy_id:id,text:tx.slice(0,2000),by_email:ST.me})),t('saved'));if(ok){UI.notesFor=null;render();}break;}
  case 'rview':UI.reqView=el.dataset.v;render();break;
  case 'rsort':{const k=el.dataset.k;UI.reqSort=[k,UI.reqSort[0]===k?-UI.reqSort[1]:-1];render();break;}
  case 'mxmode':UI.mxMode=el.dataset.v;saveUI();render();break;
  case 'mxsort':{const m=el.dataset.m;UI.mxSort=[m,UI.mxSort&&UI.mxSort[0]===m?-UI.mxSort[1]:1];render();break;}
  case 'mxpick':UI.mxPick=!UI.mxPick;render();break;
  case 'mxrm':UI.mxSel=UI.mxSel.filter(x=>x!==id);saveUI();render();break;
  case 'mxdiff':UI.mxOnlyDiff=!UI.mxOnlyDiff;render();break;
  case 'audrow':UI.audit.open=UI.audit.open===id?null:id;render();break;
  case 'audmore':loadAudit(false);break;
  case 'fsave':{const fid=el.dataset.id;const ok=await act(()=>q(sb.from('findings_status').upsert({id:fid,status:$('#fs-'+fid).value,owner:$('#fo-'+fid).value.trim().slice(0,120),note:$('#fn-'+fid).value.trim().slice(0,1000),by_email:ST.me,at:new Date().toISOString()})),t('saved'));if(ok){await reload(['misc']);render();}break;}
  case 'mdel':{const em=el.dataset.e;const ok=await act(()=>q(sb.from('members').delete().eq('email',em)),t('done_'));if(ok){await reload(['members']);render();}break;}
  case 'nmr':{el.classList.toggle('on');const on=el.classList.contains('on');el.setAttribute('aria-pressed',on);el.textContent=(on?'✓ ':'')+t('role_'+el.dataset.r);break;}
  case 'madd':{const em=$('#nmEmail').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(em)){toast(t('email'),1);break;}const rs=[...document.querySelectorAll('#nmRoles .rchip.on')].map(b=>b.dataset.r);if(!rs.length){toast(t('pickRole'),1);break;}
    const row=MULTI?{email:em,name:$('#nmName').value.trim()||null,roles:rs}:{email:em,name:$('#nmName').value.trim()||null,role:rs[0]};const ok=await act(()=>q(sb.from('members').upsert(row)),t('done_'));if(ok){await reload(['members']);render();}break;}
  case 'mrtog':{const m=ST.members.find(x=>x.email===el.dataset.e);let rs=rolesOf(m).slice();const r=el.dataset.r;
    if(!MULTI){rs=[r];}else if(rs.includes(r)){if(rs.length===1){toast(t('pickRole'),1);break;}rs=rs.filter(x=>x!==r);}else rs.push(r);
    const ok=await act(()=>q(sb.from('members').update(MULTI?{roles:rs}:{role:rs[0]}).eq('email',m.email).select('email')),t('saved'));if(ok){await reload(['members']);if(m.email.toLowerCase()===ST.me){const me=ST.members.find(x=>x.email.toLowerCase()===ST.me);ST.roles=rolesOf(me);ST.role=ST.roles[0];}render();}break;}
  case 'selfappr':{if(!can.admin())break;const ok=await act(()=>q(sb.from('settings').update({allow_self_approval:!ST.settings.allow_self_approval,updated_at:new Date().toISOString()}).eq('id',1)),t('saved'));if(ok){await reload(['settings']);render();if(ST.settings.allow_self_approval&&el.dataset.back)toast(t('selfOnToast'));}break;}
  case 'readall':await act(()=>rpc('notif_mark_read',{p_ids:null}));await reload(['notifs']);openNotifs();render();openNotifs();break;
  case 'notif':{await act(()=>rpc('notif_mark_read',{p_ids:[id]}));closeOverlay();await reload(['notifs']);if(el.dataset.cr)go('#/cr/'+el.dataset.cr);else render();break;}
  case 'copysum':{const c=ST.crs.find(x=>x.id===id),cur=ST.cur[c.policy_id];const base=c.base_version===cur.version?cur.perms:UI.verPerms[c.policy_id+':'+c.base_version];const txt=summaryPlain(c,base,UI.ed&&UI.ed.id===id?UI.ed.draft:c.draft,UI.ed&&UI.ed.id===id?UI.ed.title:c.title);
    try{await navigator.clipboard.writeText(txt);toast(t('copied'));}catch(_){const r=document.createRange();r.selectNode($('#summText'));getSelection().removeAllRanges();getSelection().addRange(r);}break;}
  case 'palgo':palGo(+el.dataset.i);break;
  case 'cmod':UI.cMod=el.dataset.m;render();break;
  case 'cdiff':UI.cOnly=UI.cOnly===false;render();break;
  case 'cmpswap':{const r=route();go(`#/compare/${r.sub}/${r.id}`);break;}
  case 'alignA':{const A=+el.dataset.a,B=+el.dataset.b;const ex=ST.crs.find(c=>c.policy_id===A&&c.status==='draft'&&c.requested_by===ST.me);
    const nid=ex?ex.id:await act(()=>rpc('cr_create',{p_policy:A}));if(!nid)break;
    const ok=await act(()=>q(sb.from('change_requests').update({draft:(ST.cur[B]||{}).perms||{},title:(LANG==='ar'?'مطابقة مع ':'Match ')+ST.byId[B].name}).eq('id',nid).select('id')));
    if(ok){await reload(['crs']);UI.ed=null;go('#/cr/'+nid+'/edit');}break;}
  }});
document.addEventListener('input',e=>{const T=e.target;
  if(T.id==='dq'){UI.q=T.value;rerender();}else if(T.id==='pq'){UI.pq=T.value;rerender();}else if(T.id==='edq'){UI.edQ=T.value;clearTimeout(rerender.t);rerender.t=setTimeout(edRefresh,150);}
  else if(T.id==='cq'){UI.cQ=T.value;rerender();}else if(T.id==='rq'){UI.reqF.q=T.value;rerender();}else if(T.id==='mxq'){UI.mxQ=T.value;clearTimeout(rerender.t);rerender.t=setTimeout(rerender,200);}
  else if(T.id==='edTitle'){UI.ed.title=T.value;edSave();}
  else if(T.dataset.act==='setv'){const k=T.dataset.k,v=T.value.trim();if(v)UI.ed.draft[k]='Value: '+v;else delete UI.ed.draft[k];edSave();clearTimeout(rerender.t);rerender.t=setTimeout(edRefresh,500);}
  else if(T.dataset.af==='q'){UI.audit.q=T.value;clearTimeout(rerender.t);rerender.t=setTimeout(()=>loadAudit(true),350);}
  else if(T.id==='palq'){PAL.q=T.value;PAL.items=palItems(T.value);PAL.i=0;drawPal();}});
document.addEventListener('change',async e=>{const T=e.target;
  if(T.id==='dsort'){UI.sort=T.value;saveUI();render();}
  else if(T.id==='vA'||T.id==='vB'){const pid=+route().id;UI[T.id]={pid,v:+T.value};render();}
  else if(T.dataset.rf){UI.reqF[T.dataset.rf]=T.value;render();}
  else if(T.dataset.af&&T.dataset.af!=='q'){UI.audit[T.dataset.af]=T.value;loadAudit(true);}
  else if(T.id==='mxMod'){UI.mxMod=T.value;render();}
  else if(T.id==='cmpA'||T.id==='cmpB'){const r=route();const a=T.id==='cmpA'?T.value:(r.id||''),b=T.id==='cmpB'?T.value:(r.sub||'');UI.cMod=null;go(`#/compare/${a}/${b}`);}
  else if(T.dataset.act==='mxtog'){const pid=+T.dataset.id;if(T.checked){if(UI.mxSel.length>=12){T.checked=false;toast(t('mxMax'),1);return;}UI.mxSel.push(pid);}else UI.mxSel=UI.mxSel.filter(x=>x!==pid);saveUI();render();}
  else if(T.dataset.act==='set'){const k=T.dataset.k;if(T.value)UI.ed.draft[k]='Value: '+T.value;else delete UI.ed.draft[k];edRefresh();edSave();}
  else if(T.dataset.act==='mrole'){const ok=await act(()=>q(sb.from('members').update({role:T.value}).eq('email',T.dataset.e)),t('saved'));if(ok){await reload(['members']);render();}}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&ST.ready){e.preventDefault();openPalette();return;}
  if(e.key==='Escape'){closeOverlay();if(UI.mxPick){UI.mxPick=false;render();}}
  if(e.target.id==='palq'){if(e.key==='ArrowDown'){PAL.i=Math.min(PAL.i+1,PAL.items.length-1);drawPal();e.preventDefault();}else if(e.key==='ArrowUp'){PAL.i=Math.max(PAL.i-1,0);drawPal();e.preventDefault();}else if(e.key==='Enter')palGo(PAL.i);}
  if(e.key==='Enter'&&e.target.matches('[data-go],[role="button"][data-act]'))e.target.click();});
window.addEventListener('hashchange',()=>{UI.mxPick=false;const r=route();if(!(r.page==='cr'&&r.sub==='edit'))UI.ed=null;if(r.page==='policy'&&r.sub)UI.pTab=r.sub;else if(r.page==='policy')UI.pTab='perms';render();window.scrollTo(0,0);});
function applyLang(){document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';}
// ---------- auth ----------
function loginView(reason){document.getElementById('app').innerHTML=`<div class="login"><div class="box"><div class="logo" style="color:var(--ink);padding:0"><span class="mark">${ICON.audit.replace('stroke="currentColor"','stroke="#fff"')}</span><span>${esc(t('appName'))}<small class="faint">${esc(t('appSub'))}</small></span></div>
  <h1>${t('lgTitle')}</h1><p>${t('lgLead')}</p>${reason?`<div class="banner ${reason==='sent'?'info':'warn'}" id="lgmsg">${esc(t('lg_'+reason))}</div>`:'<div id="lgmsg"></div>'}
  ${reason==='config'?'':`<form id="lgf"><input class="inp" id="lgEmail" type="email" required autocomplete="email" placeholder="name@company.com" style="width:100%;padding:10px 12px;margin-bottom:10px"><button class="btn pri" type="submit">${t('lgSend')}</button></form>`}
  <div style="display:flex;justify-content:space-between;margin-top:16px"><button class="btn ghost sm" data-act="lang">${t('lang')}</button>${reason==='denied'||reason==='nodata'?`<button class="btn ghost sm" data-act="signout">${t('signOut')}</button>`:''}</div></div></div>`;
  const f=$('#lgf');if(f)f.addEventListener('submit',async ev=>{ev.preventDefault();const em=$('#lgEmail').value.trim().toLowerCase();const {error}=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}});const m=$('#lgmsg');m.className='banner '+(error?'bad':'info');m.textContent=error?t('lg_err')+' ('+error.message+')':t('lg_sent');});}
async function start(session){if(start.busy)return;start.busy=1;try{ST.me=(session.user.email||'').toLowerCase();
  const mem=await loadMembers();const mine=(mem||[]).find(m=>m.email.toLowerCase()===ST.me);if(!mine){loginView('denied');return;}
  ST.roles=rolesOf(mine);ST.role=ST.roles[0];ST.name=mine.name;
  try{await loadCore();}catch(e){console.error(e);loginView('nodata');return;}
  if(!CAT.length){loginView('nodata');return;}
  render();
  sb.channel('live').on('postgres_changes',{event:'*',schema:'public',table:'change_requests'},()=>live(['crs']))
    .on('postgres_changes',{event:'*',schema:'public',table:'notifications'},p=>{if(p.new&&p.new.recipient===ST.me&&p.eventType==='INSERT')toast('🔔 '+p.new.title);live(['notifs']);})
    .on('postgres_changes',{event:'*',schema:'public',table:'policy_versions'},()=>{UI.verList={};live(['cur']);})
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'cr_events'},p=>{if(p.new)delete UI.crEvents[p.new.cr_id];live([]);}).subscribe();
 }finally{start.busy=0;}}
function live(parts){clearTimeout(live.t);live.t=setTimeout(async()=>{await reload(parts);const r=route();if(busyTyping()||(r.page==='cr'&&r.sub==='edit'))return;render();},300);}
async function boot(){applyLang();const C=window.APP_CONFIG||{};
  if(!window.supabase||!C.SUPABASE_URL||/YOUR/.test(C.SUPABASE_URL)){loginView('config');return;}
  sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'&&s&&!ST.ready)start(s);});
  const {data:{session}}=await sb.auth.getSession();if(session)start(session);else loginView();}
boot();
</script>
</body></html>
