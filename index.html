<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>PSI Policy Permissions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: iOS/macOS grouped style — translucent nav with a segmented control, large titles, inset grouped lists, policies open in a sheet */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface2:#f7f7fa; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --label:#1c1c1e; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.34); --sep:rgba(60,60,67,.14);
  --tint:#0a84ff; --tint-soft:rgba(10,132,255,.12);
  --green:#28a745; --green-soft:rgba(52,199,89,.14); --orange:#c26a00; --orange-soft:rgba(255,149,0,.15); --red:#e5372b; --red-soft:rgba(255,59,48,.12);
  --s0:#eef4ff; --s0t:#1b4fa0; --s1:#dce8fd; --s1t:#1b4fa0; --s2:#c2d7fb; --s2t:#163f80; --s3:#8db3f3; --s3t:#0c2b5e; --s4:#3a7bf0; --s4t:#ffffff; --s5:#1446a8; --s5t:#ffffff; --nil:#f4efe6; --nilt:#87622a;
  --nav:rgba(249,249,251,.78); --shadow:0 20px 60px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.06);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
  --ar:"IBM Plex Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface2:#2c2c2e; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --label:#ffffff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --tint:#0a84ff; --tint-soft:rgba(10,132,255,.22); --green:#30d158; --green-soft:rgba(48,209,88,.18); --orange:#ff9f0a; --orange-soft:rgba(255,159,10,.2); --red:#ff453a; --red-soft:rgba(255,69,58,.2);
  --s0:#16233a; --s0t:#a9c6f5; --s1:#1b2d4c; --s1t:#bcd3fa; --s2:#21406f; --s2t:#d6e5ff; --s3:#2c5aa0; --s3t:#ffffff; --s4:#3a7bf0; --s4t:#ffffff; --s5:#8ab4ff; --s5t:#071a3a; --nil:#2e2719; --nilt:#e3c48f;
  --nav:rgba(22,22,24,.72); --shadow:0 20px 60px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface2:#2c2c2e; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --label:#ffffff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --tint:#0a84ff; --tint-soft:rgba(10,132,255,.22); --green:#30d158; --green-soft:rgba(48,209,88,.18); --orange:#ff9f0a; --orange-soft:rgba(255,159,10,.2); --red:#ff453a; --red-soft:rgba(255,69,58,.2);
  --s0:#16233a; --s0t:#a9c6f5; --s1:#1b2d4c; --s1t:#bcd3fa; --s2:#21406f; --s2t:#d6e5ff; --s3:#2c5aa0; --s3t:#ffffff; --s4:#3a7bf0; --s4t:#ffffff; --s5:#8ab4ff; --s5t:#071a3a; --nil:#2e2719; --nilt:#e3c48f;
  --nav:rgba(22,22,24,.72); --shadow:0 20px 60px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--label);font-family:var(--sans);font-size:15px;line-height:1.42;margin:0;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
html[lang="ar"] body{font-family:var(--ar);letter-spacing:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--tint) 55%,transparent);outline-offset:2px;border-radius:8px}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
/* nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.navin{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;height:52px}
.brand{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navend{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:0;position:relative}
.seg button,.seg a{border:0;background:transparent;padding:5px 14px;border-radius:7px;font-size:13px;font-weight:500;color:var(--label);text-decoration:none;white-space:nowrap;transition:background .2s,box-shadow .2s}
.seg [aria-current="page"],.seg [aria-pressed="true"]{background:var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:600}
html[data-theme="dark"] .seg [aria-pressed="true"],html[data-theme="dark"] .seg [aria-current="page"]{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg [aria-pressed="true"],:root:not([data-theme="light"]) .seg [aria-current="page"]{background:#636366}}
.seg.sm button{padding:4px 10px;font-size:12.5px}
.seg.full{display:flex;width:100%}.seg.full button{flex:1}
.tb{border:0;background:transparent;color:var(--tint);font-size:15px;padding:6px 8px;border-radius:8px}
.tb:hover{background:var(--fill2)}
.who{font-size:13px;color:var(--label2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar{display:none}
@media (max-width:760px){.navin{grid-template-columns:1fr auto}.navin .seg{display:none}
  .tabbar{display:flex;position:fixed;inset:auto 0 0 0;z-index:25;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a{flex:1;text-align:center;font-size:11px;color:var(--label2);text-decoration:none;padding:4px 0;display:grid;justify-items:center;gap:2px}
  .tabbar a svg{width:24px;height:24px}
  .tabbar a[aria-current="page"]{color:var(--tint)}
  main{padding-bottom:90px!important}}
/* page */
main{padding-block:28px 72px}
.large{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.025em;margin:0 0 6px;line-height:1.1;text-wrap:balance}
html[lang="ar"] .large{font-family:var(--ar);letter-spacing:0}
.sub{color:var(--label2);margin:0 0 26px;max-width:62ch;font-size:15px}
.sechead{font-size:13px;font-weight:400;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;margin:28px 16px 7px}
html[lang="ar"] .sechead{text-transform:none;letter-spacing:0;font-size:14px}
.secfoot{font-size:13px;color:var(--label2);margin:7px 16px 0}
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative;width:100%;text-align:start;background:transparent;border:0;color:inherit}
.row+.row::before,.row+.rowx::before,.rowx+.row::before{content:"";position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;border-top:.5px solid var(--sep)}
button.row:hover,a.row:hover,.row.tap:hover{background:var(--fill2)}
.row .main{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:400;overflow-wrap:anywhere}
.row .t.b{font-weight:600}
.row .s{font-size:13px;color:var(--label2);margin-top:1px}
.row .end{display:flex;align-items:center;gap:8px;color:var(--label2);font-size:15px;flex-shrink:0}
.chev{width:8px;height:13px;color:var(--label3);flex-shrink:0}
html[dir="rtl"] .chev{transform:scaleX(-1)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-green{background:var(--green-soft);color:var(--green)}.b-orange{background:var(--orange-soft);color:var(--orange)}.b-red{background:var(--red-soft);color:var(--red)}.b-gray{background:var(--fill);color:var(--label2)}.b-tint{background:var(--tint-soft);color:var(--tint)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.d-High{background:var(--red)}.d-Medium{background:var(--orange)}.d-Low{background:var(--tint)}
.cap{display:inline-flex;align-items:center;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5}
.l0{background:var(--s0);color:var(--s0t)}.l1{background:var(--s1);color:var(--s1t)}.l2{background:var(--s2);color:var(--s2t)}.l3{background:var(--s3);color:var(--s3t)}.l4{background:var(--s4);color:var(--s4t)}.l5{background:var(--s5);color:var(--s5t)}.ln{background:var(--nil);color:var(--nilt)}
.btn{border:0;border-radius:10px;padding:8px 16px;font-size:15px;font-weight:600;background:var(--fill);color:var(--tint)}
.btn.primary{background:var(--tint);color:#fff}
.btn.green{background:var(--green-soft);color:var(--green)}.btn.red{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{border:0;background:none;color:var(--tint);padding:0;font-size:inherit}
input.fld,select.fld,textarea.fld{width:100%;border:0;background:var(--fill2);border-radius:10px;padding:10px 12px;font-size:15px;outline:none}
input.fld:focus,textarea.fld:focus,select.fld:focus{box-shadow:0 0 0 3px var(--tint-soft)}
.search{position:relative}
.search input{width:100%;border:0;background:var(--fill);border-radius:10px;padding:9px 12px 9px 34px;font-size:16px;outline:none}
html[dir="rtl"] .search input{padding:9px 34px 9px 12px}
.search svg{position:absolute;top:50%;inset-inline-start:10px;transform:translateY(-50%);width:16px;height:16px;color:var(--label2)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.controls .search{flex:1 1 260px}
.sel{border:0;background:var(--fill);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:500}
/* overview */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:18px}
.ringcard{display:flex;align-items:center;gap:16px}
.ring{width:76px;height:76px;flex-shrink:0}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--fill)}
.ring .fg{stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.big{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.big small{font-size:15px;color:var(--label2);font-weight:500}
.cap2{font-size:13px;color:var(--label2);margin-top:2px}
.alertcard .big{color:var(--red)}
.find{padding:14px 16px;display:grid;gap:10px;position:relative}
.find+.find::before{content:"";position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;border-top:.5px solid var(--sep)}
.find h3{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.find p{margin:0;color:var(--label2);font-size:14px}
.find .rec{font-size:14px;color:var(--label)}
.find .ftools{display:grid;grid-template-columns:auto 1fr 1.6fr auto;gap:8px;align-items:center}
.find .meta{font-size:12px;color:var(--label3)}
.polchips{display:flex;flex-wrap:wrap;gap:6px}
.polchips button{border:0;background:var(--fill2);color:var(--tint);border-radius:7px;padding:3px 9px;font-size:12.5px;font-weight:500}
@media (max-width:760px){.find .ftools{grid-template-columns:1fr}}
/* policy list */
.plist .row{padding-block:12px}
.prow{display:grid;grid-template-columns:minmax(170px,1fr) minmax(0,2.6fr) auto;gap:14px;align-items:center}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.strip .cell{display:grid;gap:2px}
.strip .mod{font-size:10.5px;color:var(--label3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.strip .lv{font-size:12.5px}
.counts{display:flex;gap:10px;font-size:12px;color:var(--label3);align-items:center}
@media (max-width:760px){.who{display:none}.prow{grid-template-columns:1fr}.strip{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lv{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--label);white-space:nowrap;min-width:0}
.lv span{overflow:hidden;text-overflow:ellipsis}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:12px;flex-shrink:0}
.bars i{display:block;width:3px;border-radius:1.5px;background:var(--fill)}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}.bars i:nth-child(3){height:8px}.bars i:nth-child(4){height:10px}.bars i:nth-child(5){height:12px}
.bars i.f{background:var(--tint)}
.lv.wide .bars i.f{background:var(--orange)}
.lv.nt{color:var(--orange)}.lv.nt .bars i{background:transparent;box-shadow:inset 0 0 0 1px var(--orange)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12px;color:var(--label2);margin:0 4px 12px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:40;animation:fade .25s ease}
.sheet{position:fixed;z-index:41;inset:24px 0 0;margin:0 auto;width:min(860px,100%);background:var(--bg);border-radius:14px 14px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:up .35s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:8px auto 0}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px 0}
.sbody{overflow-y:auto;flex:1;padding:4px max(20px,env(safe-area-inset-left,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.stitle{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;line-height:1.15;overflow-wrap:anywhere}
html[lang="ar"] .stitle{font-family:var(--ar);letter-spacing:0}
.modscroll{overflow-x:auto;margin:16px -4px 0;padding:0 4px 2px}
.modscroll .seg{min-width:max-content}
.rulerow{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;position:relative;width:100%;background:transparent;border:0;text-align:start}
.rulerow+.rulerow::before{content:"";position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;border-top:.5px solid var(--sep)}
.rulerow:hover{background:var(--fill2)}
.rulerow .main{flex:1;min-width:0}
.rulerow .t{font-size:15px;direction:ltr;text-align:start}
.rulerow .s{font-size:12.5px;color:var(--label2);margin-top:2px;direction:ltr;text-align:start}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:55%}
.chip-on{background:var(--green-soft);color:var(--green);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.chip-none{color:var(--label3);font-size:13px}
.sw{width:42px;height:26px;border-radius:13px;background:var(--fill);position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:inset-inline-start .2s}
.sw.on{background:var(--green)}.sw.on::after{inset-inline-start:18px}
.val{font-family:var(--mono);font-size:13px;color:var(--label2);direction:ltr}
.form{padding:14px 16px;background:var(--surface2);display:grid;gap:10px}
.form label{font-size:12.5px;color:var(--label2);display:block;margin-bottom:4px}
.formrow{display:flex;gap:8px;flex-wrap:wrap}
table.tick{border-collapse:collapse;font-size:12px;width:100%;direction:ltr}
.tick th{font-weight:500;color:var(--label2);padding:8px 4px;text-align:center;font-size:11px;line-height:1.2;vertical-align:bottom}
.tick th.rn,.tick td.rn{text-align:left;white-space:nowrap;padding-inline:12px 10px}
.tick td{padding:6px 4px;text-align:center;border-top:.5px solid var(--sep)}
.tick tr.sec td{text-align:left;color:var(--label2);font-size:11px;background:var(--surface2);padding-inline:12px}
.ck{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;font-weight:700}
.ckn{display:inline-block;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--label3)}
.scrollx{overflow-x:auto}
.msg{padding:11px 16px;position:relative}
.msg+.msg::before{content:"";position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;border-top:.5px solid var(--sep)}
.msg .who{font-size:13px;font-weight:600}
.msg .who span{font-weight:400;color:var(--label3)}
.msg .txt{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.empty{padding:14px 16px;color:var(--label2);font-size:14px}
.chg{font-family:var(--mono);font-size:13px;direction:ltr;text-align:start;overflow-wrap:anywhere}
.chg s{color:var(--red)}.chg b{color:var(--green)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.dvrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:10px;padding:10px 16px;position:relative;font-size:13px;direction:ltr;align-items:center}
.dvrow+.dvrow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.dvrow.h{font-size:12px;color:var(--label2);font-weight:600}
.on{color:var(--green);font-weight:600}.off{color:var(--label3)}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface);color:var(--label);box-shadow:var(--shadow);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;display:flex;gap:8px;align-items:center;animation:up .25s ease}
.banner{background:var(--orange-soft);color:var(--orange);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:18px}
.login{max-width:400px;margin:8vh auto 0;text-align:center}
.login .icon{width:64px;height:64px;border-radius:16px;background:linear-gradient(160deg,#3a8dff,#0a5ad8);display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 8px 24px rgba(10,132,255,.35)}
.login form{display:grid;gap:12px;margin-top:22px;text-align:start}
.login .btn{width:100%;padding:12px}
.note{font-size:13px;color:var(--label2);margin-top:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function vals(v){const s=new Set();let np='';(v||'').split('+').forEach(t=>{t=t.trim();if(!t||t==='-')return;if(t.startsWith('NP(')){s.add('NP');np=t.slice(3,-1);}else s.add(t);});return {s,np};}
function gridRows(mod,label,v,na){const {s,np}=vals(v);return COLS.map(([c,n])=>na.includes(n)?[mod,label+' › '+n,'N/A']:[mod,label+' › '+n,s.has(c)?('Enabled'+(c==='NP'&&np?': '+np:'')):'Disabled']);}
function rowsFor(p){

  for(const k of ['Le','Co','Un','Pr','Ac','Ag']){const m=p.m[k],mod=MODN[k];

      for(const [tag,u,labels] of [['Sale',m.S,SALE],['Lease',m.L,LEASE]]){
        labels.forEach((lab,i)=>{const sec=i<8?`${tag} › ${tag} listings`:`${tag} › More rules`;let sc,num;

          if(sc==='x')sc='';const na=(i>=6&&i<=7)?['Named people']:[];

      continue;}
    const g={};m.grid.split(';').map(x=>x.trim()).filter(Boolean).forEach(x=>{const [a,b]=x.split('=');g[a]=b;});
    GRIDROWS[k].forEach(([c,l])=>R.push(...gridRows(mod,l,g[c]||'',k==='Ag'?['Me']:[])));

  const md=T.closest('[data-mod]');if(md){UI.mod=md.dataset.mod;UI.req=null;renderSheet();return;}
  const ut=T.closest('[data-ut]');if(ut){UI.ut=ut.dataset.ut;UI.req=null;renderSheet();return;}
  if(T.closest('#mxToggle')){UI.matrix=!UI.matrix;UI.req=null;renderSheet();return;}
  const rq=T.closest('[data-req]');if(rq){const rule=rq.dataset.req;if(UI.req&&UI.req.rule===rule){UI.req=null;}else{const isOpt=rowsFor(BYID[UI.open]).some(r=>r[1]===rule);UI.req={rule,perm:isOpt?rule:''};}renderSheet();const f=$('pfPerm');if(f)f.focus();return;}
  if(T.id==='pfCancel'){UI.req=null;renderSheet();return;}
  if(T.id==='pfSubmit'){const p=BYID[UI.open];const perm=$('pfPerm').value;const cur=(rowsFor(p).find(r=>r[1]===perm&&r[0]===MODN[UI.mod])||[])[2]||'';
    const nv=/^(Enabled|Disabled)/.test(cur)?(cur.startsWith('Enabled')?'Disabled':'Enabled'):($('pfNew')?$('pfNew').value.trim():'');if(!perm||!nv){toastErr(t('reqd'));return;}
    const ok=await write(()=>sb.from('proposals').insert({policy_id:p.id,module:MODN[UI.mod],perm,current:cur,proposed:nv,reason:$('pfWhy').value.trim().slice(0,1000),by_email:me}));if(ok){UI.req=null;renderSheet();}return;}
  const rv=T.closest('[data-rv]');if(rv&&!rv.disabled){const st=rv.dataset.rv;await write(()=>st==='none'?sb.from('reviews').delete().eq('policy_id',UI.open):sb.from('reviews').upsert({policy_id:UI.open,status:st,by_email:me,at:new Date().toISOString()}));return;}
  if(T.id==='noteAdd'){const tx=$('noteTxt').value.trim();if(!tx)return;const ok=await write(()=>sb.from('notes').insert({policy_id:UI.open,text:tx.slice(0,2000),by_email:me}));if(ok){$('noteTxt').value='';renderSheet();}return;}
  const dc=T.closest('[data-dec]');if(dc){await write(()=>sb.from('decisions').upsert({proposal_id:dc.dataset.pid,decision:dc.dataset.dec,by_email:me,at:new Date().toISOString()}));return;}
  const fst=T.closest('[data-fst]');if(fst&&!fst.disabled){const id=fst.dataset.fst,s=S.findings[id]||{};await write(()=>sb.from('findings_status').upsert({id,status:fst.dataset.v,owner:$('fo-'+id).value.trim().slice(0,120)||s.owner||null,note:$('fn-'+id).value.trim().slice(0,1000)||s.note||null,by_email:me,at:new Date().toISOString()}),t('statusSaved'));return;}
  const fs=T.closest('[data-fsave]');if(fs){const id=fs.dataset.fsave,s=S.findings[id]||{};await write(()=>sb.from('findings_status').upsert({id,status:s.status||'open',owner:$('fo-'+id).value.trim().slice(0,120),note:$('fn-'+id).value.trim().slice(0,1000),by_email:me,at:new Date().toISOString()}));return;}
  const ff=T.closest('[data-ff]');if(ff){UI.ff=ff.dataset.ff;renderOverview();return;}
  const pp=T.closest('[data-ppl]');if(pp){UI.ppl=pp.dataset.ppl;try{localStorage.setItem('ppl',UI.ppl)}catch(_){}renderList();return;}
  const pf=T.closest('[data-pf]');if(pf){UI.pf=pf.dataset.pf;renderProposals();return;}
  if(T.id==='lang'){LANG=LANG==='en'?'ar':'en';try{localStorage.setItem('lang',LANG)}catch(_){}renderStatic();renderAll();}
});
document.addEventListener('change',e=>{const id=e.target.id;
  if(id==='pfPerm'){UI.req.perm=e.target.value;UI.req.reason=$('pfWhy')?$('pfWhy').value:'';renderSheet();}
  if(id==='cmpA'||id==='cmpB')renderCompare();if(id==='rvFilter'||id==='sortBy')renderList();});
$('q').addEventListener('input',renderList);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.open)closeSheet();});
window.addEventListener('hashchange',()=>{closeSheet();renderAll();});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const em=$('lgEmail').value.trim().toLowerCase();if(!em||!sb)return;$('lgBtn').disabled=true;
  const {error}=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}});$('lgBtn').disabled=false;
  $('loginMsg').hidden=false;$('loginMsg').textContent=error?t('lg_err')+' ('+error.message+')':t('lg_sent');});
$('signout').addEventListener('click',async()=>{if(sb)await sb.auth.signOut();location.hash='';location.reload();});
boot();
</script>

</body></html>
